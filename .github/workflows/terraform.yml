name: Terraform

on:
  push:
    branches: [ homework ]
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      TF_VAR_token: ${{ secrets.TF_VAR_TOKEN }}
      TF_VAR_cloud_id: ${{ secrets.TF_VAR_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.TF_VAR_FOLDER_ID }}
      TF_VAR_zone: ${{ secrets.TF_VAR_ZONE }}
      TF_VAR_subnet_id: ${{ secrets.TF_VAR_SUBNET_ID }}
      TF_VAR_ssh_key: ${{ secrets.TF_VAR_SSH_KEY }}
      TF_VAR_vm_name: ${{ secrets.TF_VAR_VM_NAME }}
      TF_VAR_disk_size_gb: ${{ secrets.TF_VAR_DISK_SIZE_GB }}
      TF_VAR_cores: ${{ secrets.TF_VAR_CORES }}
      TF_VAR_memory: ${{ secrets.TF_VAR_MEMORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve
        working-directory: terraform